[project]
name = "designspace"
version = "0.0.0"
description = "Declarative algorithm design spaces with a polars-like expression API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
# Docs-only, never core. Core stays numpy + rfc8785.
docs = [
    "sphinx>=8",
    "pydata-sphinx-theme>=0.16",
    "myst-parser>=4",
    # myst-nb supersedes myst-parser as the `.md` parser (see docs/conf.py) and
    # executes the tutorial pages at build time. myst-parser stays listed above
    # because `myst_heading_anchors` and `myst_enable_extensions` are still ours.
    "myst-nb>=1.4",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "mypy>=1.10",
    "ruff>=0.5",
    "polars>=1.0",
    # Drives the docstring gates in tests/test_docs.py. It is the only tool that
    # computes publicity from `__all__`, which is the scoping those gates
    # need: ruff's D1xx rules never fire here, every implementation module
    # being private.
    "griffe>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/designspace"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
# The test suite only. Doctests are a separate commit gate with its own command
# (see CLAUDE.md), so no `addopts` here bends this run into something else:
# `pytest tests/unit/test_frame.py` collects that file and nothing more.
testpaths = ["tests"]
# Applies to the doctest gate, which runs `--doctest-modules --doctest-glob=*.md`
# over `src` and `docs`: every `>>>` in a docstring is a test, and so is
# every `>>>` on a design-note page.
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
# No `norecursedirs` override. It was restated here without "build" because the
# builder package was once named `src/designspace/build/`, which collides
# with pytest's default entry for setuptools output, so the doctest gate
# collected nothing from it while reporting green. The package is `builder/`
# as of 2026-08-06, so pytest's defaults are correct as they ship.

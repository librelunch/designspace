[project]
name = "designspace"
version = "0.0.0"
description = "Declarative design spaces with a polars-like expression API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
docs = [
    "sphinx>=8",
    "pydata-sphinx-theme>=0.16",
    "myst-parser>=4",
    # myst-nb supersedes myst-parser as the `.md` parser (see docs/conf.py) and
    # executes the user-guide pages at build time. myst-parser stays listed above
    # because `myst_heading_anchors` and `myst_enable_extensions` are still ours.
    "myst-nb>=1.4",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "mypy>=1.10",
    "ruff>=0.5",
    "polars>=1.0",
    "ipython>=9",
    # Drives the docstring gates in tests/test_docs.py. It is the only tool that
    # computes publicity from `__all__`, which is the scoping those gates
    # need: ruff's D1xx rules never fire here, every implementation module
    # being private.
    "griffe>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/designspace"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

# `polars` is an optional extra, so on a core install there is nothing for mypy
# to resolve the two `TYPE_CHECKING` imports of it against, and the type gate
# fails for the absence of a package the core path is defined to work without.
# This covers only that case: where the extra is installed, mypy reads polars'
# real types exactly as before, and every other module stays under `strict`.
[[tool.mypy.overrides]]
module = ["polars", "polars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# The test suite only. Doctests are a separate gate with their own command.
testpaths = ["tests"]
addopts = ["--strict-markers"]
# A test carries this when it needs the optional `polars` extra.
markers = [
    "requires_polars: exercises DataFrame output, which needs the `polars` extra",
]
# Applies to the doctest gate, which runs `--doctest-modules --doctest-glob=*.md`
# over `src`, `docs` and `README.md`: every `>>>` in a docstring is a test, and
# so is every `>>>` on a design-note page or in the README.
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]

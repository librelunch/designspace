[project]
name = "designspace"
version = "0.0.0"
description = "Declarative algorithm design spaces with a polars-like expression API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
# Docs-only, never core (M13.5). Core stays numpy + rfc8785.
docs = [
    "sphinx>=8",
    "pydata-sphinx-theme>=0.16",
    "myst-parser>=4",
    "sphinx-copybutton>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "mypy>=1.10",
    "ruff>=0.5",
    "polars>=1.0",
    # Drives the docstring gates in tests/test_docs.py. It is the only tool that
    # computes publicity from `__all__`, which is the scoping M13 requires: ruff's
    # D1xx rules never fire here because every implementation module is private.
    "griffe>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/designspace"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
# `src` is a testpath because every `>>>` example in a docstring is a test
# (M13). Keeping `--doctest-modules` in addopts rather than in a separate
# command is what lets CLAUDE.md's four commit gates stay four commands.
testpaths = ["tests", "src", "docs"]
# `--doctest-glob` makes the guide pages' `>>>` blocks tests too (M13.5), one
# runner and one gate. `docs` must stay on `testpaths` above or they collect to
# zero silently — the same shape as the `norecursedirs`/`build` hole M13 found.
# Measured when this landed: no `.md` in the repo carries a `>>>` line outside
# `docs/`, so this cannot accidentally execute `API.md`'s signature listings.
addopts = "--doctest-modules --doctest-glob=*.md"
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
# pytest's default norecursedirs contains "build", which would silently skip
# every doctest in src/designspace/build/ — the package holding `ds.param`,
# `ds.space`, and `Space`. Restated without it. `dist` stays excluded, and
# testpaths already confines collection to tests/ and src/.
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]

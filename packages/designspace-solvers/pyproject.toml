[project]
name = "designspace-solvers"
version = "0.0.0"
description = "Solver bindings for designspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # A floor, so that an install outside the workspace resolves core from an
    # index rather than accepting whatever version is present. `tool.uv.sources`
    # below redirects this to the workspace member and is read by uv alone, so
    # pip installing this package from the repository needs the floor to be
    # right.
    "designspace>=0.1",
    "numpy>=1.26",
]

# One extra per backend. A backend imports its solver lazily and raises a plain
# `ImportError` naming its extra when the install is absent, matching how core
# treats its own optional dependencies.
[project.optional-dependencies]
# The floor names a pre-release, which is what admits one: the binding writes
# constraints through `Trial.set_constraint`, added in this release.
optuna = ["optuna>=5.0.0rc1"]
# `CatCMAwM` lives behind the `cmawm` extra, which is what brings scipy.
cmaes = ["cmaes[cmawm]>=0.13"]
# 1.2.2 is the release that introduced the ordering forbidden clauses the
# translation builds; on 1.2.0 and 1.2.1 they are simply absent.
configspace = ["ConfigSpace>=1.2.2"]
# scikit-learn<1.9 because of https://github.com/automl/SMAC3/issues/1336
smac = ["smac>=2.4", "scikit-learn<1.9"]

[tool.uv.sources]
designspace = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/designspace_solvers"]

# No lint, type or test configuration here. The workspace shares one
# environment and one set of tool settings, defined at the root, so a standard
# cannot drift between core and this package.

name: ci
# Every gate below is a `just` recipe. The justfile is their one definition,
# shared with the local git hooks, so a gate cannot drift between a developer's
# machine and CI. Nothing here spells a gate command out.
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: extractions/setup-just@v4
      - run: uv sync
      # One step per gate, so a failure names itself in the job summary.
      - run: just lint
      - run: just format
      - run: just types
      - run: just test
      - run: just doctest
      # The sibling solver package, across the same interpreter matrix. Both
      # backends it exercises declare support for every version listed above.
      - run: just solvers

  docs:
    # The docs gate. The recipe carries `--extra docs`, which installs the extra
    # for that run alone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v4
      - run: just docs

  core-only:
    # Proves the core install path (numpy + rfc8785 only, no `polars` extra)
    # actually works. The `test-core` recipe deselects the `requires_polars`
    # marker, which each test that needs the extra declares for itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: extractions/setup-just@v4
      - run: uv sync --no-install-package polars
      - run: uv run python -c "import designspace"
      - run: just test-core
      # Doctests over `src` reach this job too, which is what the single
      # `# doctest: +SKIP` in `builder/_space.py` is for. No `.md` page carrying
      # a `>>>` block touches polars.
      - run: just doctest

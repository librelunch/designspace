name: ci
# Every gate below is a `just` recipe. The justfile is their one definition,
# shared with the local git hooks, so a gate cannot drift between a developer's
# machine and CI. Nothing here spells a gate command out.
on:
  push:
  pull_request:

# The irace binding's bridge publishes no Linux wheel, so every runner here
# builds it from source. That build compiles against R's headers by default and
# fails where R is absent, which is every job below: they exercise the
# translation, which never starts R. Loading `libR` at run time instead makes R
# a requirement of running a race rather than of installing the package.
# `devenv.nix` sets the same value, so a developer's machine and CI build it
# the same way.
env:
  RPY2_CFFI_MODE: ABI

# Every job that sets uv up names its own cache suffix. The generated key
# otherwise covers only the interpreter and the lockfile, so jobs sharing a
# Python version collide and race to save one key. Pruning is on by default, so
# a per-job cache holds just what that job installed rather than a copy of
# everything.
jobs:
  checks:
    runs-on: ubuntu-latest
    # A cap on every job here. The gates run in under two minutes, so a job
    # still going well past that is a hung action rather than slow work, and
    # a hung one holds a runner until GitHub's own six-hour default ends it.
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: checks
      - uses: extractions/setup-just@v4
      - run: uv sync
      # One step per gate, so a failure names itself in the job summary.
      - run: just lint
      - run: just format
      - run: just types
      - run: just test
      - run: just doctest
      # The sibling solver package, across the same interpreter matrix. Every
      # backend it exercises declares support for every version listed above.
      - run: just gates-solvers

  docs:
    # The docs gate.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          cache-suffix: build-docs
      - uses: extractions/setup-just@v4
      - run: just build-docs

  irace:
    # The irace binding against a real irace, the one job that installs R. The
    # translation is ordinary Python and runs across the whole matrix in
    # `checks`; this covers what only irace can answer, meaning whether it
    # accepts the names, conditions and forbidden expressions the binding
    # writes. Pinned to one interpreter because rpy2 declares support through
    # 3.13, and running a race on a second version would test R, not the
    # binding.
    runs-on: ubuntu-latest
    # The longest cap here, because this job installs R and builds irace and
    # what it sits on before it reaches a gate.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          cache-suffix: irace
      - uses: extractions/setup-just@v4
      # `use-public-rspm` serves Linux binaries, which matters: irace needs
      # compilation and so do `data.table` and `matrixStats` beneath it.
      #
      # The current release, which `devenv.nix` also tracks, rather than a
      # pinned version. R 4.5 is the floor: rpy2 resolves `R_getVar` as it
      # imports under the ABI mode set above, and R gained that function at
      # 4.5.0, so an older `libR` fails every test here on the symbol.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - run: Rscript -e 'install.packages("irace")'
      - run: Rscript -e 'stopifnot(packageVersion("irace") >= "4.4")'
      - run: uv sync
      - run: just gates-irace

  core-only:
    # Proves the core install path (numpy + rfc8785 only, no `polars` extra)
    # actually works. The `test-core` recipe deselects the `requires_polars`
    # marker, which each test that needs the extra declares for itself.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          cache-suffix: core-only
      - uses: extractions/setup-just@v4
      - run: uv sync --no-install-package polars
      - run: uv run python -c "import designspace"
      - run: just test-core
      # Doctests over `src` reach this job too, which is what the single
      # `# doctest: +SKIP` in `builder/_space.py` is for. No `.md` page carrying
      # a `>>>` block touches polars.
      - run: just doctest
